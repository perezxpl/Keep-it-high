<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <!-- Mroczne Niebo Kaldery z Wulkanicznym Dymem -->
    <linearGradient id="calderaSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0404"/>
      <stop offset="35%" stop-color="#140706"/>
      <stop offset="70%" stop-color="#220b08"/>
      <stop offset="100%" stop-color="#3d120a"/>
    </linearGradient>

    <!-- Wrzące Jezioro Magmy na Dnie -->
    <linearGradient id="magmaLakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="25%" stop-color="#ff3700"/>
      <stop offset="65%" stop-color="#bf1500"/>
      <stop offset="100%" stop-color="#4d0500"/>
    </linearGradient>

    <!-- Żarzący się gradient Erupcji Gejzeru -->
    <linearGradient id="geyserFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ffea00"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="85%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="rgba(220, 38, 38, 0)"/>
    </linearGradient>

    <!-- Bazaltowe Kolumny Obsydianowe -->
    <linearGradient id="basaltPillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f0d11"/>
      <stop offset="30%" stop-color="#1e1b24"/>
      <stop offset="70%" stop-color="#2a2633"/>
      <stop offset="100%" stop-color="#121016"/>
    </linearGradient>

    <!-- Radialne żarzenie magmy -->
    <radialGradient id="magmaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa00" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ff3300" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dymiące Tło Kaldery -->
  <rect width="600" height="340" fill="url(#calderaSkyGrad)"/>

  <!-- Chmury wulkanicznego pyłu i popiołu -->
  <path d="M-20,90 Q90,50 220,75 T440,60 T620,80 L620,240 L-20,240 Z" fill="#1f0907" opacity="0.6"/>
  <path d="M10,110 Q140,75 300,95 T580,85 L620,240 L10,240 Z" fill="#140605" opacity="0.75"/>

  <!-- Dalekie strome ściany kaldery z żyłami lawy -->
  <polygon points="0,40 140,160 0,220" fill="#161219"/>
  <polygon points="600,40 460,160 600,220" fill="#161219"/>
  <!-- Pęknięcia lawowe na dalekich ścianach -->
  <path d="M10,60 L50,110 L30,150 L70,180" stroke="#f97316" stroke-width="1.5" fill="none" opacity="0.75"/>
  <path d="M590,60 L550,110 L570,150 L530,180" stroke="#f97316" stroke-width="1.5" fill="none" opacity="0.75"/>

  <!-- ================= MONUMENTALNE BAZALTOWE KOLUMNY W CENTRUM ================= -->
  <!-- Lewa Kolumna Obsydianowa -->
  <polygon points="175,60 205,60 210,270 170,270" fill="url(#basaltPillarGrad)"/>
  <line x1="175" y1="60" x2="170" y2="270" stroke="#374151" stroke-width="1.5"/>
  <line x1="205" y1="60" x2="210" y2="270" stroke="#374151" stroke-width="1.5"/>
  <!-- Heksagonalne krawędzie kolumny lewej -->
  <line x1="190" y1="60" x2="190" y2="270" stroke="#4b5563" stroke-width="1"/>
  <!-- Pęknięcie z magmą w lewej kolumnie -->
  <path d="M185,120 L195,150 L188,190 L192,230" stroke="#ff4500" stroke-width="1.5" fill="none" opacity="0.9"/>

  <!-- Prawa Kolumna Obsydianowa -->
  <polygon points="395,60 425,60 430,270 390,270" fill="url(#basaltPillarGrad)"/>
  <line x1="395" y1="60" x2="390" y2="270" stroke="#374151" stroke-width="1.5"/>
  <line x1="425" y1="60" x2="430" y2="270" stroke="#374151" stroke-width="1.5"/>
  <line x1="410" y1="60" x2="410" y2="270" stroke="#4b5563" stroke-width="1"/>
  <path d="M415,100 L405,140 L418,180" stroke="#ff4500" stroke-width="1.5" fill="none" opacity="0.9"/>

  <!-- ================= FLANKI: BAZALTOWE RAMPY I PÓŁKI SKALNE ================= -->
  <!-- Lewa Rampa Lawowa (Kąt ~32°, wślizg postaci) -->
  <polygon points="20,130 140,210 140,230 20,150" fill="#1c1921"/>
  <line x1="20" y1="130" x2="140" y2="210" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="20" y1="131" x2="140" y2="211" stroke="#f97316" stroke-width="1"/>

  <!-- Dolna stacja zachodnia (podest łączący z lewą kolumną) -->
  <polygon points="140,210 175,210 175,225 140,225" fill="#2d2836" stroke="#4b5563" stroke-width="1"/>
  <!-- Porzucony kontener badawczy Vulcan-01 (isCover: true) -->
  <rect x="145" y="195" width="22" height="15" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
  <line x1="148" y1="198" x2="164" y2="198" stroke="#fca5a5" stroke-width="1"/>

  <!-- Prawa Rampa Lawowa (Kąt ~32°) -->
  <polygon points="580,130 460,210 460,230 580,150" fill="#1c1921"/>
  <line x1="580" y1="130" x2="460" y2="210" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="580" y1="131" x2="460" y2="211" stroke="#f97316" stroke-width="1"/>

  <!-- Dolna stacja wschodnia ze skrzyniami aparatury -->
  <polygon points="460,210 425,210 425,225 460,225" fill="#2d2836" stroke="#4b5563" stroke-width="1"/>
  <rect x="435" y="198" width="16" height="12" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>

  <!-- ================= PODWIESZANE KŁADKI TECHNOLOGICZNE NA ŁAŃCUCHACH ================= -->
  <!-- Łańcuchy podwieszenia -->
  <line x1="230" y1="0" x2="230" y2="110" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="370" y1="0" x2="370" y2="110" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="250" y1="110" x2="250" y2="190" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="350" y1="110" x2="350" y2="190" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Górny podwieszany pomost stalowy (x: 215..385, y: 110) -->
  <rect x="215" y="110" width="170" height="7" fill="#374151" stroke="#9ca3af" stroke-width="1"/>
  <!-- Blok obsydianu na moście jako osłona -->
  <polygon points="290,110 310,110 305,96 295,96" fill="#111827" stroke="#4b5563" stroke-width="1"/>

  <!-- Dolna kładka pośrednia (x: 235..365, y: 190) -->
  <rect x="235" y="190" width="130" height="6" fill="#1f2937" stroke="#6b7280" stroke-width="1"/>

  <!-- ================= ERUPCJA GEJZERU LAWY (SZCZELINA X: 210) ================= -->
  <!-- Płomienny gejzer strzelający w górę ze szczeliny magmowej -->
  <polygon points="198,270 216,270 214,140 207,110 200,140" fill="url(#geyserFlameGrad)"/>
  <!-- Rdzeń gejzeru (gorąca biel) -->
  <polygon points="204,270 210,270 209,160 205,160" fill="#ffffff" opacity="0.9"/>
  <!-- Iskry wystrzeliwane przez gejzer -->
  <circle cx="206" cy="105" r="2" fill="#ffea00"/>
  <circle cx="212" cy="118" r="1.5" fill="#ffea00"/>
  <circle cx="201" cy="125" r="1.5" fill="#ff5500"/>
  <circle cx="218" cy="135" r="2" fill="#ffea00"/>

  <!-- Druga szczelina (uśpiona z telegrafowaniem dymu, X: 395) -->
  <ellipse cx="390" cy="270" rx="16" ry="5" fill="#ff3700"/>
  <path d="M385,270 Q380,240 395,215 T385,180" stroke="#f97316" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="3,3"/>

  <!-- ================= WRZĄCE JEZIORO MAGMY NA DNIE (Y: 265..340) ================= -->
  <rect x="0" y="265" width="600" height="75" fill="url(#magmaLakeGrad)"/>

  <!-- Żarzące się plamy i pęcherze lawowe -->
  <circle cx="100" cy="285" r="45" fill="url(#magmaGlow)"/>
  <circle cx="300" cy="280" r="60" fill="url(#magmaGlow)"/>
  <circle cx="500" cy="285" r="45" fill="url(#magmaGlow)"/>

  <!-- Pękające pęcherze magmowe na powierzchni -->
  <ellipse cx="120" cy="272" rx="14" ry="4" fill="#ffea00"/>
  <ellipse cx="300" cy="270" rx="22" ry="5" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="480" cy="273" rx="16" ry="4" fill="#ffea00"/>

  <!-- Unoszące się iskry i drobiny żaru -->
  <circle cx="80" cy="230" r="1.5" fill="#ff9900"/>
  <circle cx="160" cy="210" r="1.2" fill="#ff5500"/>
  <circle cx="270" cy="220" r="1.8" fill="#ffea00"/>
  <circle cx="340" cy="170" r="1.5" fill="#ff9900"/>
  <circle cx="450" cy="240" r="1.2" fill="#ff5500"/>
  <circle cx="530" cy="200" r="1.5" fill="#ffea00"/>

  <!-- ================= RAMKA TAKTYCZNA I NAPISY ODPRAWY ================= -->
  <rect x="10" y="10" width="580" height="320" fill="none" stroke="#ea580c" stroke-width="1" opacity="0.3"/>
  <rect x="18" y="18" width="7" height="7" fill="#ea580c" opacity="0.8"/>
  <rect x="575" y="18" width="7" height="7" fill="#ea580c" opacity="0.8"/>

  <!-- Etykieta Sektora -->
  <rect x="18" y="298" width="180" height="24" fill="#0f0505" opacity="0.9" rx="3"/>
  <rect x="18" y="298" width="180" height="24" fill="none" stroke="#ea580c" stroke-width="1" opacity="0.7"/>
  <text x="28" y="314" fill="#fb923c" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="1.5">SEKTOR 04 // OBSIDIAN</text>
</svg>
