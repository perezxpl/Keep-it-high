<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <!-- Deep Space Gradient -->
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="50%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#09142b"/>
    </linearGradient>

    <!-- Earth Atmosphere Limb Radial Gradient -->
    <radialGradient id="atmoGlow" cx="50%" cy="130%" r="90%">
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="78%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="92%" stop-color="#0369a1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Earth Ocean Gradient -->
    <radialGradient id="oceanGrad" cx="50%" cy="130%" r="85%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#0f2b5c"/>
      <stop offset="85%" stop-color="#061833"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Solar Panel Cyan Glow Gradient -->
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="50%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Station Hull Gradient -->
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Repulsor Kinetic Field Gradient -->
    <linearGradient id="repulsorGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="600" height="340" fill="url(#spaceGrad)"/>

  <!-- Starfield (Distant Stars) -->
  <g fill="#ffffff">
    <circle cx="45" cy="35" r="1" opacity="0.8"/>
    <circle cx="120" cy="70" r="1.5" opacity="0.9"/>
    <circle cx="85" cy="140" r="0.8" opacity="0.6"/>
    <circle cx="210" cy="45" r="1" opacity="0.75"/>
    <circle cx="280" cy="25" r="1.8" opacity="0.95"/>
    <circle cx="340" cy="65" r="0.9" opacity="0.7"/>
    <circle cx="395" cy="30" r="1.2" opacity="0.85"/>
    <circle cx="460" cy="80" r="1" opacity="0.65"/>
    <circle cx="530" cy="40" r="1.6" opacity="0.9"/>
    <circle cx="570" cy="110" r="0.8" opacity="0.7"/>
    <circle cx="160" cy="110" r="0.9" opacity="0.5"/>
    <circle cx="510" cy="135" r="1.2" opacity="0.8"/>
    <circle cx="25" cy="190" r="1" opacity="0.6"/>
    <circle cx="585" cy="180" r="0.8" opacity="0.5"/>
  </g>

  <!-- Distant Orbital Relay Station -->
  <g opacity="0.6">
    <line x1="80" y1="55" x2="110" y2="55" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="95" cy="55" r="5" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <rect x="70" y="52" width="8" height="6" fill="#38bdf8" opacity="0.6"/>
    <rect x="112" y="52" width="8" height="6" fill="#38bdf8" opacity="0.6"/>
    <circle cx="95" cy="48" r="1" fill="#ef4444"/>
  </g>

  <!-- Planet Earth Horizon Curvature -->
  <ellipse cx="300" cy="460" rx="420" ry="240" fill="url(#oceanGrad)"/>
  <ellipse cx="300" cy="460" rx="430" ry="250" fill="none" stroke="url(#atmoGlow)" stroke-width="16"/>
  <ellipse cx="300" cy="460" rx="422" ry="242" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.85"/>

  <!-- Earth Atmospheric Cloud Wisps -->
  <path d="M 120,295 Q 260,265 420,285 Q 520,300 580,330" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.22"/>
  <path d="M 60,320 Q 220,285 360,300" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.18"/>

  <!-- Golden City Lights on Night Side -->
  <g fill="#fef08a" opacity="0.8">
    <rect x="190" y="305" width="2" height="2"/>
    <rect x="196" y="308" width="1.5" height="1.5"/>
    <rect x="230" y="300" width="2" height="2"/>
    <rect x="236" y="302" width="1.5" height="1.5"/>
    <rect x="360" y="305" width="2" height="2"/>
    <rect x="375" y="312" width="2.5" height="2"/>
    <rect x="420" y="318" width="2" height="2"/>
  </g>

  <!-- Truss Girders for Station Wings -->
  <line x1="80" y1="165" x2="520" y2="165" stroke="#334155" stroke-width="4"/>
  <line x1="120" y1="165" x2="210" y2="150" stroke="#1e293b" stroke-width="2"/>
  <line x1="480" y1="165" x2="390" y2="150" stroke="#1e293b" stroke-width="2"/>

  <!-- Left Solar Panel Wing (3 Segments with Neon-Blue #38bdf8 Outlines) -->
  <g>
    <!-- Segment L3 -->
    <rect x="75" y="152" width="38" height="24" fill="url(#solarGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="94" y1="152" x2="94" y2="176" stroke="#0284c7" stroke-width="1"/>
    <!-- Segment L2 -->
    <rect x="120" y="152" width="38" height="24" fill="url(#solarGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="139" y1="152" x2="139" y2="176" stroke="#0284c7" stroke-width="1"/>
    <!-- Segment L1 -->
    <rect x="165" y="152" width="38" height="24" fill="url(#solarGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="184" y1="152" x2="184" y2="176" stroke="#0284c7" stroke-width="1"/>
  </g>

  <!-- Right Solar Panel Wing (3 Segments with Neon-Blue #38bdf8 Outlines) -->
  <g>
    <!-- Segment R1 -->
    <rect x="397" y="152" width="38" height="24" fill="url(#solarGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="416" y1="152" x2="416" y2="176" stroke="#0284c7" stroke-width="1"/>
    <!-- Segment R2 -->
    <rect x="442" y="152" width="38" height="24" fill="url(#solarGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="461" y1="152" x2="461" y2="176" stroke="#0284c7" stroke-width="1"/>
    <!-- Segment R3 -->
    <rect x="487" y="152" width="38" height="24" fill="url(#solarGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="506" y1="152" x2="506" y2="176" stroke="#0284c7" stroke-width="1"/>
  </g>

  <!-- Left Kinetic Repulsor (Jump Pad) -->
  <g>
    <rect x="208" y="146" width="16" height="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="210" y="118" width="12" height="28" fill="url(#repulsorGrad)"/>
    <text x="216" y="132" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">▲</text>
  </g>

  <!-- Right Kinetic Repulsor (Jump Pad) -->
  <g>
    <rect x="376" y="146" width="16" height="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="378" y="118" width="12" height="28" fill="url(#repulsorGrad)"/>
    <text x="384" y="132" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">▲</text>
  </g>

  <!-- Central Combat Module ARES (900px scaled to preview) -->
  <g>
    <!-- Module Body Outer Hull -->
    <rect x="228" y="142" width="144" height="68" rx="2" fill="url(#hullGrad)" stroke="#475569" stroke-width="2"/>

    <!-- Corridor Catwalk Window / Interior -->
    <rect x="240" y="160" width="120" height="24" fill="#070c18" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="240" y1="172" x2="360" y2="172" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>

    <!-- Roof Armor Platforms -->
    <rect x="226" y="138" width="46" height="6" fill="#475569" stroke="#64748b" stroke-width="1"/>
    <rect x="328" y="138" width="46" height="6" fill="#475569" stroke="#64748b" stroke-width="1"/>
    <!-- Central Roof Hatch -->
    <rect x="274" y="140" width="52" height="4" fill="#0284c7" opacity="0.8"/>

    <!-- Two Vertical Cover Walls on Roof -->
    <rect x="254" y="124" width="6" height="16" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <rect x="340" y="124" width="6" height="16" fill="#334155" stroke="#94a3b8" stroke-width="1"/>

    <!-- Station Decals & Badges -->
    <text x="300" y="196" font-family="monospace" font-size="6.5" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="1">STACJA ORBITALNA ARES</text>
  </g>

  <!-- Tactical HUD Target Grid Lines -->
  <line x1="20" y1="20" x2="50" y2="20" stroke="#0284c7" stroke-width="1.5" opacity="0.6"/>
  <line x1="20" y1="20" x2="20" y2="50" stroke="#0284c7" stroke-width="1.5" opacity="0.6"/>
  <line x1="580" y1="20" x2="550" y2="20" stroke="#0284c7" stroke-width="1.5" opacity="0.6"/>
  <line x1="580" y1="20" x2="580" y2="50" stroke="#0284c7" stroke-width="1.5" opacity="0.6"/>

  <text x="24" y="32" font-family="monospace" font-size="8" font-weight="bold" fill="#38bdf8" letter-spacing="0.5">[SEKTOR 04: PRÓŻNIA KOSMICZNA]</text>
  <text x="24" y="44" font-family="monospace" font-size="7" fill="#64748b" letter-spacing="0.5">GRAWITACJA: 0.72 // JETPACK: +60%</text>
</svg>
