<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <!-- Storm Sky Gradient -->
    <linearGradient id="typhoonSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#090e1a"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>

    <!-- Ocean Depths Gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e2338"/>
      <stop offset="35%" stop-color="#0a1726"/>
      <stop offset="100%" stop-color="#02060d"/>
    </linearGradient>

    <!-- Steel Rig Gradient -->
    <linearGradient id="steelTrussGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Oil Puddle Sheen Gradient -->
    <linearGradient id="oilSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="35%" stop-color="#1e3a8a" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#059669" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <!-- Dark Tempest Sky -->
  <rect width="600" height="340" fill="url(#typhoonSkyGrad)"/>

  <!-- Storm Cloud Banks -->
  <path d="M-50,80 Q60,30 180,70 T420,50 T650,90 L650,220 L-50,220 Z" fill="#080e1a" opacity="0.6"/>
  <path d="M-20,120 Q120,70 260,110 T520,80 T630,130 L630,240 L-20,240 Z" fill="#0b1322" opacity="0.4"/>

  <!-- Distant Lightning Silhouette Flash -->
  <polygon points="340,10 332,60 348,60 336,110 354,110 338,160" fill="#bae6fd" opacity="0.35"/>

  <!-- The Derrick Tower (Wieża Wiertnicza w centrum) -->
  <g stroke="#1e293b" stroke-width="2.5" fill="none">
    <!-- Main Legs -->
    <line x1="270" y1="220" x2="288" y2="60" stroke="#334155" stroke-width="3"/>
    <line x1="330" y1="220" x2="312" y2="60" stroke="#334155" stroke-width="3"/>
    <!-- X-Braces -->
    <line x1="272" y1="200" x2="328" y2="175"/>
    <line x1="328" y1="200" x2="272" y2="175"/>
    <line x1="275" y1="175" x2="325" y2="150"/>
    <line x1="325" y1="175" x2="275" y2="150"/>
    <line x1="278" y1="150" x2="322" y2="125"/>
    <line x1="322" y1="150" x2="278" y2="125"/>
    <line x1="281" y1="125" x2="319" y2="100"/>
    <line x1="319" y1="125" x2="281" y2="100"/>
    <line x1="284" y1="100" x2="316" y2="75"/>
    <line x1="316" y1="100" x2="284" y2="75"/>
    <!-- Crown Block Top -->
    <rect x="284" y="52" width="32" height="8" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
    <!-- Central Drill Pipe Guide -->
    <line x1="300" y1="60" x2="300" y2="220" stroke="#475569" stroke-width="2.5"/>
    <!-- Gas Flare Stack & Flame -->
    <line x1="340" y1="220" x2="340" y2="70" stroke="#1e293b" stroke-width="3"/>
    <circle cx="344" cy="65" r="5" fill="#f97316"/>
    <circle cx="343" cy="66" r="2.5" fill="#fef08a"/>
  </g>

  <!-- Moving Gantry Crane Rail & Platform (y: 125, width: 85) -->
  <g>
    <line x1="235" y1="110" x2="365" y2="110" stroke="#0f172a" stroke-width="4"/>
    <rect x="260" y="125" width="80" height="7" fill="#1e293b" stroke="#eab308" stroke-width="1.2"/>
    <line x1="280" y1="110" x2="275" y2="125" stroke="#475569" stroke-width="1.5"/>
    <line x1="320" y1="110" x2="325" y2="125" stroke="#475569" stroke-width="1.5"/>
    <!-- Drill pipes load on crane -->
    <rect x="275" y="122" width="50" height="3" fill="#64748b"/>
  </g>

  <!-- Pylons Substructure in Ocean (Szkielet wiertni) -->
  <g fill="#1e293b" stroke="#0f172a" stroke-width="2">
    <!-- Helipad Angled Pylon -->
    <line x1="90" y1="185" x2="160" y2="280" stroke="#1e293b" stroke-width="6"/>
    <line x1="90" y1="185" x2="160" y2="280" stroke="#334155" stroke-width="3"/>
    <!-- Main Deck Pylons -->
    <rect x="180" y="235" width="14" height="60"/>
    <rect x="260" y="235" width="14" height="60"/>
    <rect x="340" y="235" width="14" height="60"/>
    <rect x="420" y="235" width="14" height="60"/>
    <!-- Cross Bracing -->
    <line x1="180" y1="240" x2="274" y2="285" stroke="#0f172a" stroke-width="3"/>
    <line x1="274" y1="240" x2="180" y2="285" stroke="#0f172a" stroke-width="3"/>
    <line x1="340" y1="240" x2="434" y2="285" stroke="#0f172a" stroke-width="3"/>
    <line x1="434" y1="240" x2="340" y2="285" stroke="#0f172a" stroke-width="3"/>
  </g>

  <!-- Platforms -->
  <!-- 1. Extended Helipad (Left Flank) -->
  <g>
    <rect x="35" y="175" width="115" height="10" fill="url(#steelTrussGrad)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="92" cy="180" r="4" fill="none" stroke="#eab308" stroke-width="1"/>
    <text x="92" y="181.5" font-family="monospace" font-size="3.5" font-weight="bold" fill="#eab308" text-anchor="middle" dominant-baseline="middle">H</text>
    <circle cx="38" cy="177" r="1.5" fill="#22c55e"/>
    <circle cx="147" cy="177" r="1.5" fill="#22c55e"/>
  </g>

  <!-- 2. Main Technical Deck (Center) -->
  <g>
    <rect x="160" y="220" width="270" height="15" fill="url(#steelTrussGrad)" stroke="#475569" stroke-width="1.8"/>
    <!-- Hazard Stripes on Edges -->
    <rect x="160" y="220" width="12" height="15" fill="#eab308"/>
    <rect x="418" y="220" width="12" height="15" fill="#eab308"/>
    <!-- Yellow Deck Handrails -->
    <line x1="172" y1="215" x2="418" y2="215" stroke="#eab308" stroke-width="1.2"/>
    <line x1="172" y1="217.5" x2="418" y2="217.5" stroke="#eab308" stroke-width="1.2"/>
    <!-- Tactical Containers on Deck -->
    <rect x="185" y="210" width="18" height="10" fill="#3f6212" stroke="#1e293b" stroke-width="1"/>
    <rect x="330" y="210" width="18" height="10" fill="#334155" stroke="#1e293b" stroke-width="1"/>
    <!-- Oil Puddles on Deck -->
    <rect x="208" y="218.5" width="40" height="2.5" fill="url(#oilSheen)"/>
    <rect x="352" y="218.5" width="40" height="2.5" fill="url(#oilSheen)"/>
    <!-- Flame Tongue on Oil Puddle -->
    <polygon points="225,219 228,212 231,219" fill="#f97316"/>
    <polygon points="226,219 228,214 230,219" fill="#fef08a"/>
    <circle cx="229" cy="208" r="3" fill="#18181b" opacity="0.6"/>
    <circle cx="231" cy="203" r="4.5" fill="#18181b" opacity="0.4"/>
  </g>

  <!-- 3. Refinery & Engine Walkway (Right Flank) -->
  <g>
    <rect x="450" y="175" width="115" height="10" fill="url(#steelTrussGrad)" stroke="#475569" stroke-width="1.5"/>
    <!-- Chimney Stacks -->
    <rect x="475" y="130" width="12" height="45" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
    <rect x="475" y="130" width="12" height="6" fill="#eab308"/>
    <rect x="530" y="130" width="12" height="45" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
    <rect x="530" y="130" width="12" height="6" fill="#eab308"/>
    <!-- Steam Wisps -->
    <ellipse cx="481" cy="126" rx="4" ry="2" fill="#cbd5e1" opacity="0.3"/>
    <ellipse cx="536" cy="126" rx="4" ry="2" fill="#cbd5e1" opacity="0.3"/>
  </g>

  <!-- Turbulent Sea / Ocean Death Zone (y: 285..340) -->
  <rect x="0" y="285" width="600" height="55" fill="url(#oceanGrad)"/>
  <path d="M0,285 Q30,278 60,285 T120,285 T180,285 T240,285 T300,285 T360,285 T420,285 T480,285 T540,285 T600,285 L600,340 L0,340 Z" fill="#0d243c"/>
  <path d="M0,292 Q25,286 50,292 T100,292 T150,292 T200,292 T250,292 T300,292 T350,292 T400,292 T450,292 T500,292 T550,292 T600,292 L600,340 L0,340 Z" fill="#113252"/>
  <!-- Sea Foam Crests -->
  <path d="M0,292 Q25,286 50,292 T100,292 T150,292 T200,292 T250,292 T300,292 T350,292 T400,292 T450,292 T500,292 T550,292 T600,292" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.85"/>

  <!-- Tactical HUD Stencil Overlay -->
  <g font-family="monospace" font-size="8" font-weight="bold" fill="#64748b">
    <text x="25" y="32">SECTOR 04 // TYPHOON OIL RIG</text>
    <text x="25" y="44" fill="#0284c7">HAZARD: TURBULENT OCEAN // ACTIVE CRANE // CRUDE OIL</text>
  </g>
</svg>
