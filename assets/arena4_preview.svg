<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <!-- Ocean Sky Gradient -->
    <linearGradient id="navalSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1728"/>
      <stop offset="45%" stop-color="#142842"/>
      <stop offset="80%" stop-color="#234366"/>
      <stop offset="100%" stop-color="#3b5d82"/>
    </linearGradient>

    <!-- Ocean Water Gradient -->
    <linearGradient id="navalOceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2135"/>
      <stop offset="50%" stop-color="#071320"/>
      <stop offset="100%" stop-color="#03080f"/>
    </linearGradient>

    <!-- Battleship Steel Hull Gradient -->
    <linearGradient id="carrierHullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Flight Deck Gradient -->
    <linearGradient id="flightDeckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#111620"/>
    </linearGradient>

    <!-- Superstructure Bridge Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="340" fill="url(#navalSkyGrad)"/>

  <!-- High Altitude Jet Contrails -->
  <line x1="20" y1="40" x2="280" y2="18" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <line x1="320" y1="25" x2="580" y2="50" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>

  <!-- Distant Clouds -->
  <path d="M-20,130 Q80,85 220,115 T480,95 T620,125 L620,220 L-20,220 Z" fill="#1b2f48" opacity="0.45"/>
  <path d="M20,150 Q160,110 320,135 T580,120 L620,220 L20,220 Z" fill="#14263b" opacity="0.6"/>

  <!-- Ocean Horizon & Sea -->
  <rect x="0" y="210" width="600" height="130" fill="url(#navalOceanGrad)"/>
  <line x1="0" y1="210" x2="600" y2="210" stroke="rgba(147,197,253,0.3)" stroke-width="1"/>

  <!-- Distant Escort Warship (Destroyer Silhouette) -->
  <g fill="#112233" opacity="0.85">
    <path d="M70,210 L85,204 L135,204 L145,210 Z"/>
    <rect x="95" y="196" width="22" height="8"/>
    <rect x="102" y="191" width="10" height="5"/>
    <line x1="107" y1="191" x2="107" y2="183" stroke="#112233" stroke-width="1"/>
  </g>

  <!-- Massive Aircraft Carrier Hull (USS TITAN) -->
  <!-- Main Hull Body -->
  <polygon points="35,245 48,295 560,295 575,245" fill="url(#carrierHullGrad)"/>
  <!-- Red Bottom Antifouling Coat -->
  <polygon points="46,285 48,295 560,295 562,285" fill="#5c1d1d"/>
  <!-- Boot-topping stripe -->
  <rect x="44" y="281" width="519" height="4" fill="#090d14"/>

  <!-- Deck Sponsons and Catwalks -->
  <rect x="50" y="250" width="160" height="3" fill="#334155"/>
  <rect x="230" y="250" width="180" height="3" fill="#334155"/>

  <!-- Main Flight Deck (Gigantic Flat Runway) -->
  <rect x="40" y="244" width="530" height="18" fill="url(#flightDeckGrad)"/>
  <line x1="38" y1="244" x2="572" y2="244" stroke="#64748b" stroke-width="1.5"/>

  <!-- Runway Centerline Stripes -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-dasharray="16,10">
    <line x1="75" y1="250" x2="440" y2="250"/>
  </g>

  <!-- Yellow Safety Boundary Lines -->
  <line x1="60" y1="247" x2="450" y2="247" stroke="#eab308" stroke-width="1"/>
  <line x1="60" y1="254" x2="450" y2="254" stroke="#eab308" stroke-width="1"/>

  <!-- Steam Catapult Zone (Left Section) -->
  <rect x="70" y="244" width="85" height="3" fill="#090d14"/>
  <line x1="70" y1="245" x2="155" y2="245" stroke="#f59e0b" stroke-width="0.8"/>
  <rect x="150" y="243" width="6" height="3" fill="#f59e0b"/>

  <!-- Steam Clouds Erupting from Catapult -->
  <g fill="rgba(241, 245, 249, 0.45)">
    <circle cx="105" cy="242" r="6"/>
    <circle cx="120" cy="240" r="9"/>
    <circle cx="138" cy="238" r="11"/>
    <circle cx="155" cy="237" r="8"/>
  </g>
  <g fill="rgba(241, 245, 249, 0.25)">
    <circle cx="115" cy="236" r="12"/>
    <circle cx="135" cy="232" r="15"/>
    <circle cx="150" cy="231" r="13"/>
  </g>

  <!-- Deck Stencil "CVN-99 TITAN" -->
  <text x="290" y="258" fill="rgba(241,245,249,0.35)" font-family="sans-serif" font-weight="900" font-size="9" text-anchor="middle">CVN-99 TITAN</text>

  <!-- Tactical Fighter Jet A (Cover 1: x ~ 210) -->
  <g transform="translate(210, 244)">
    <!-- Wheels -->
    <rect x="-8" y="-3" width="2" height="3" fill="#0f172a"/>
    <rect x="7" y="-3" width="2" height="3" fill="#0f172a"/>
    <!-- Fuselage -->
    <path d="M-15,-6 L-7,-10 L-2,-11 L10,-9 L13,-13 L15,-11 L15,-5 L-7,-5 Z" fill="#334155" stroke="#1e293b" stroke-width="0.7"/>
    <!-- Amber Canopy -->
    <path d="M-7,-9 L-2,-10 L1,-9 L-1,-7 Z" fill="#f59e0b" opacity="0.85"/>
  </g>

  <!-- Tactical Fighter Jet B (Cover 2: x ~ 350) -->
  <g transform="translate(350, 244) scale(-1, 1)">
    <!-- Wheels -->
    <rect x="-8" y="-3" width="2" height="3" fill="#0f172a"/>
    <rect x="7" y="-3" width="2" height="3" fill="#0f172a"/>
    <!-- Fuselage -->
    <path d="M-15,-6 L-7,-10 L-2,-11 L10,-9 L13,-13 L15,-11 L15,-5 L-7,-5 Z" fill="#334155" stroke="#1e293b" stroke-width="0.7"/>
    <!-- Amber Canopy -->
    <path d="M-7,-9 L-2,-10 L1,-9 L-1,-7 Z" fill="#f59e0b" opacity="0.85"/>
  </g>

  <!-- Island Superstructure / Command Bridge (Right Side) -->
  <!-- Island Main Tower -->
  <polygon points="460,244 470,140 540,140 550,244" fill="url(#bridgeGrad)"/>

  <!-- Bridge Windows PRI-FLY (Green Tactical Glass) -->
  <rect x="475" y="160" width="25" height="7" fill="#10b981" opacity="0.6"/>
  <rect x="505" y="160" width="28" height="7" fill="#10b981" opacity="0.6"/>
  <rect x="478" y="195" width="45" height="6" fill="#10b981" opacity="0.45"/>

  <!-- Level 1 Catwalk (x: ~465..535, y: 210) -->
  <rect x="466" y="212" width="70" height="5" fill="#1e293b"/>
  <line x1="466" y1="209" x2="536" y2="209" stroke="#94a3b8" stroke-width="0.8"/>

  <!-- Level 2 Catwalk (x: ~480..535, y: 178) -->
  <rect x="480" y="180" width="56" height="5" fill="#1e293b"/>
  <line x1="480" y1="177" x2="536" y2="177" stroke="#94a3b8" stroke-width="0.8"/>

  <!-- Level 3 Catwalk / Radar Roof (x: ~495..535, y: 140) -->
  <rect x="495" y="140" width="40" height="5" fill="#1e293b"/>
  <line x1="495" y1="137" x2="535" y2="137" stroke="#94a3b8" stroke-width="0.8"/>

  <!-- Radar Masts and SPY Phased Array -->
  <line x1="515" y1="140" x2="515" y2="110" stroke="#475569" stroke-width="2"/>
  <line x1="506" y1="122" x2="524" y2="122" stroke="#475569" stroke-width="1.2"/>
  <!-- Rotating Radar Bar -->
  <line x1="505" y1="110" x2="525" y2="110" stroke="#cbd5e1" stroke-width="1.8"/>
  <circle cx="515" cy="110" r="1.5" fill="#ef4444"/>
  <!-- Satcom Radome Domes -->
  <circle cx="502" cy="136" r="3.5" fill="#e2e8f0"/>
  <circle cx="528" cy="136" r="3.5" fill="#e2e8f0"/>

  <!-- Rest of Ocean Waves & Wake -->
  <path d="M30,250 Q36,247 42,250 T54,250" fill="none" stroke="rgba(224,242,254,0.6)" stroke-width="1"/>
  <path d="M565,250 Q572,247 578,250 T590,250" fill="none" stroke="rgba(224,242,254,0.6)" stroke-width="1"/>

  <!-- Title Badge (Futuristic Modern Military HUD) -->
  <rect x="20" y="20" width="220" height="42" fill="rgba(10, 23, 40, 0.85)" stroke="#38bdf8" stroke-width="1.2" rx="3"/>
  <text x="32" y="38" fill="#38bdf8" font-family="monospace" font-weight="900" font-size="12" letter-spacing="1">SEKTOR 04 // NAVAL OPS</text>
  <text x="32" y="52" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="11">LOTNISKOWIEC // USS TITAN</text>
</svg>
