<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="orangeNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGrad)"/>

  <!-- City Skyline Silhouettes -->
  <path d="M 0 220 L 30 220 L 30 140 L 70 140 L 70 180 L 110 180 L 110 90 L 150 90 L 150 220 L 180 220 L 180 130 L 230 130 L 230 220 L 370 220 L 370 110 L 420 110 L 420 170 L 460 170 L 460 100 L 510 100 L 510 220 L 600 220 L 600 340 L 0 340 Z" fill="#090d16" opacity="0.8"/>

  <!-- Neon City Windows / Accents -->
  <line x1="110" y1="100" x2="150" y2="100" stroke="#00e5ff" stroke-width="1.5" opacity="0.4"/>
  <line x1="110" y1="120" x2="150" y2="120" stroke="#00e5ff" stroke-width="1.5" opacity="0.3"/>
  <line x1="460" y1="120" x2="510" y2="120" stroke="#f97316" stroke-width="1.5" opacity="0.4"/>
  <line x1="460" y1="140" x2="510" y2="140" stroke="#f97316" stroke-width="1.5" opacity="0.3"/>

  <!-- Stadium Pitch Grid Floor -->
  <rect x="0" y="220" width="600" height="120" fill="url(#pitchGrad)"/>
  <line x1="0" y1="220" x2="600" y2="220" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>

  <!-- Perspective Grid lines -->
  <line x1="0" y1="220" x2="100" y2="340" stroke="#00e5ff" stroke-width="1" opacity="0.25"/>
  <line x1="200" y1="220" x2="230" y2="340" stroke="#00e5ff" stroke-width="1" opacity="0.25"/>
  <line x1="300" y1="220" x2="300" y2="340" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="400" y1="220" x2="370" y2="340" stroke="#f97316" stroke-width="1" opacity="0.25"/>
  <line x1="600" y1="220" x2="500" y2="340" stroke="#f97316" stroke-width="1" opacity="0.25"/>

  <!-- Left Cyan Goal Frame -->
  <rect x="20" y="150" width="10" height="70" fill="#00e5ff" opacity="0.9"/>
  <rect x="20" y="150" width="60" height="6" fill="#00e5ff" opacity="0.9"/>
  <line x1="80" y1="150" x2="80" y2="220" stroke="#00e5ff" stroke-width="3" opacity="0.7"/>
  <line x1="20" y1="170" x2="80" y2="170" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
  <line x1="20" y1="190" x2="80" y2="190" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>

  <!-- Right Orange Goal Frame -->
  <rect x="570" y="150" width="10" height="70" fill="#f97316" opacity="0.9"/>
  <rect x="520" y="150" width="60" height="6" fill="#f97316" opacity="0.9"/>
  <line x1="520" y1="150" x2="520" y2="220" stroke="#f97316" stroke-width="3" opacity="0.7"/>
  <line x1="520" y1="170" x2="580" y2="170" stroke="#f97316" stroke-width="1" opacity="0.4"/>
  <line x1="520" y1="190" x2="580" y2="190" stroke="#f97316" stroke-width="1" opacity="0.4"/>

  <!-- Center Altar with Ball -->
  <polygon points="270,220 330,220 320,195 280,195" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Hologram Beam -->
  <polygon points="285,195 315,195 325,140 275,140" fill="#00e5ff" opacity="0.12"/>
  <!-- Glowing Ball -->
  <circle cx="300" cy="165" r="14" fill="#ffffff" stroke="#00e5ff" stroke-width="3"/>
  <circle cx="300" cy="165" r="22" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Tactical Searchlights -->
  <polygon points="70,140 0,0 120,0" fill="#00e5ff" opacity="0.06"/>
  <polygon points="530,140 480,0 600,0" fill="#f97316" opacity="0.06"/>

  <!-- Overhead HUD Banner -->
  <rect x="210" y="20" width="180" height="26" rx="4" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1"/>
  <text x="300" y="37" fill="#38bdf8" font-family="'Orbitron', monospace" font-size="10" font-weight="700" letter-spacing="2" text-anchor="middle">CYBER STADIUM</text>
</svg>
