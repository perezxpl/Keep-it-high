<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <!-- Night Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02050c"/>
      <stop offset="38%" stop-color="#06101c"/>
      <stop offset="70%" stop-color="#091b1a"/>
      <stop offset="100%" stop-color="#071511"/>
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081320"/>
      <stop offset="60%" stop-color="#0a191a"/>
      <stop offset="100%" stop-color="#0b1f1a"/>
    </linearGradient>

    <!-- Basalt Cliff Gradient -->
    <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141d27"/>
      <stop offset="35%" stop-color="#0d141c"/>
      <stop offset="70%" stop-color="#080e14"/>
      <stop offset="100%" stop-color="#04070a"/>
    </linearGradient>

    <!-- River Water Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b4965"/>
      <stop offset="40%" stop-color="#0c2a42"/>
      <stop offset="100%" stop-color="#04111c"/>
    </linearGradient>

    <!-- Moon Halo -->
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#02050c" stop-opacity="0"/>
    </radialGradient>

    <!-- Firefly Glow -->
    <radialGradient id="fireflyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#a3e635" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="340" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g fill="#e0f2fe" opacity="0.75">
    <circle cx="45" cy="35" r="1"/>
    <circle cx="92" cy="72" r="0.8"/>
    <circle cx="130" cy="28" r="1.2"/>
    <circle cx="178" cy="85" r="0.9"/>
    <circle cx="215" cy="42" r="1.4"/>
    <circle cx="260" cy="98" r="0.8"/>
    <circle cx="310" cy="30" r="1.1"/>
    <circle cx="345" cy="65" r="1.5"/>
    <circle cx="390" cy="22" r="1"/>
    <circle cx="480" cy="80" r="1.2"/>
    <circle cx="525" cy="38" r="0.8"/>
    <circle cx="565" cy="92" r="1.3"/>
    <circle cx="80" cy="110" r="0.7"/>
    <circle cx="150" cy="120" r="0.9"/>
    <circle cx="280" cy="115" r="0.8"/>
    <circle cx="540" cy="115" r="1"/>
  </g>

  <!-- Moon Halo & Crescent Moon -->
  <circle cx="440" cy="68" r="50" fill="url(#moonHalo)"/>
  <circle cx="440" cy="68" r="14" fill="#08101a" opacity="0.6"/>
  <path d="M 440 54 A 14 14 0 0 1 440 82 Q 448 68 440 54 Z" fill="#f0f9ff"/>

  <!-- Moonbeams -->
  <polygon points="430,68 450,68 530,340 370,340" fill="#bae6fd" opacity="0.035"/>
  <polygon points="410,68 430,68 310,340 220,340" fill="#bae6fd" opacity="0.025"/>

  <!-- Distant Mountain Ridge -->
  <path d="M 0 340 L 0 210 Q 70 190 140 175 Q 220 160 300 178 Q 360 140 410 115 Q 460 135 520 185 Q 560 200 600 205 L 600 340 Z" fill="url(#mountainGrad)"/>
  <path d="M 0 210 Q 70 190 140 175 Q 220 160 300 178 Q 360 140 410 115 Q 460 135 520 185 Q 560 200 600 205" stroke="#bae6fd" stroke-width="1.2" opacity="0.2" fill="none"/>

  <!-- Canopy Silhouettes in Background -->
  <path d="M 0 340 L 0 230 Q 50 195 90 225 Q 140 190 180 220 Q 230 185 270 215 Q 350 200 400 230 Q 460 195 510 225 Q 560 200 600 220 L 600 340 Z" fill="#040c09" opacity="0.85"/>

  <!-- River Gorge (Center Water) -->
  <rect x="210" y="275" width="180" height="65" fill="url(#waterGrad)"/>
  <line x1="210" y1="275" x2="390" y2="275" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  <!-- Water Shimmer Lines -->
  <line x1="240" y1="285" x2="275" y2="285" stroke="#bae6fd" stroke-width="1.2" opacity="0.45"/>
  <line x1="300" y1="292" x2="345" y2="292" stroke="#bae6fd" stroke-width="1.4" opacity="0.5"/>
  <line x1="260" y1="305" x2="310" y2="305" stroke="#bae6fd" stroke-width="1" opacity="0.35"/>
  <line x1="320" y1="318" x2="360" y2="318" stroke="#bae6fd" stroke-width="1.2" opacity="0.4"/>

  <!-- Left Basalt Cliff -->
  <path d="M 0 340 L 0 250 Q 80 250 150 254 Q 185 260 215 285 L 215 340 Z" fill="url(#cliffGrad)"/>

  <!-- Left Edge Moss & Rim Light -->
  <path d="M 0 250 Q 80 250 150 254 Q 185 260 215 285" stroke="#14331a" stroke-width="5" fill="none"/>
  <path d="M 0 249 Q 80 249 150 253 Q 185 259 215 284" stroke="#bae6fd" stroke-width="1.6" opacity="0.55" fill="none"/>

  <!-- Right Basalt Cliff -->
  <path d="M 600 340 L 600 250 Q 520 250 450 254 Q 415 260 385 285 L 385 340 Z" fill="url(#cliffGrad)"/>

  <!-- Right Edge Moss & Rim Light -->
  <path d="M 600 250 Q 520 250 450 254 Q 415 260 385 285" stroke="#14331a" stroke-width="5" fill="none"/>
  <path d="M 600 249 Q 520 249 450 253 Q 415 259 385 284" stroke="#bae6fd" stroke-width="1.6" opacity="0.55" fill="none"/>

  <!-- Suspension Bridge across Gorge -->
  <!-- Main Suspension Cable (Catenary curve) -->
  <path d="M 215 240 Q 300 262 385 240" stroke="#475569" stroke-width="2" fill="none"/>
  <!-- Bridge Deck -->
  <line x1="215" y1="250" x2="385" y2="250" stroke="#3e2716" stroke-width="5"/>
  <line x1="215" y1="250" x2="385" y2="250" stroke="#64748b" stroke-width="1" stroke-dasharray="8,4"/>
  <!-- Vertical Ropes -->
  <line x1="240" y1="243" x2="240" y2="250" stroke="#64748b" stroke-width="1"/>
  <line x1="270" y1="248" x2="270" y2="250" stroke="#64748b" stroke-width="1"/>
  <line x1="300" y1="251" x2="300" y2="250" stroke="#64748b" stroke-width="1"/>
  <line x1="330" y1="248" x2="330" y2="250" stroke="#64748b" stroke-width="1"/>
  <line x1="360" y1="243" x2="360" y2="250" stroke="#64748b" stroke-width="1"/>

  <!-- Left Watchtower / Outpost Structure -->
  <rect x="35" y="160" width="8" height="90" fill="#321e10"/>
  <rect x="65" y="160" width="8" height="90" fill="#321e10"/>
  <line x1="35" y1="180" x2="73" y2="230" stroke="#251408" stroke-width="2.5"/>
  <line x1="73" y1="180" x2="35" y2="230" stroke="#251408" stroke-width="2.5"/>
  <rect x="25" y="155" width="58" height="7" fill="#4a2e18"/>
  <rect x="22" y="148" width="64" height="4" fill="#00e5ff" opacity="0.8"/>

  <!-- Right Watchtower / Outpost Structure -->
  <rect x="525" y="160" width="8" height="90" fill="#321e10"/>
  <rect x="555" y="160" width="8" height="90" fill="#321e10"/>
  <line x1="525" y1="180" x2="563" y2="230" stroke="#251408" stroke-width="2.5"/>
  <line x1="563" y1="180" x2="525" y2="230" stroke="#251408" stroke-width="2.5"/>
  <rect x="517" y="155" width="58" height="7" fill="#4a2e18"/>
  <rect x="514" y="148" width="64" height="4" fill="#f97316" opacity="0.8"/>

  <!-- Fireflies (Bioluminescent Glow Dots) -->
  <circle cx="160" cy="235" r="7" fill="url(#fireflyGlow)"/>
  <circle cx="160" cy="235" r="1.5" fill="#fef08a"/>

  <circle cx="230" cy="210" r="6" fill="url(#fireflyGlow)"/>
  <circle cx="230" cy="210" r="1.3" fill="#fef08a"/>

  <circle cx="320" cy="235" r="8" fill="url(#fireflyGlow)"/>
  <circle cx="320" cy="235" r="1.8" fill="#fef08a"/>

  <circle cx="370" cy="205" r="6" fill="url(#fireflyGlow)"/>
  <circle cx="370" cy="205" r="1.4" fill="#fef08a"/>

  <circle cx="450" cy="230" r="7" fill="url(#fireflyGlow)"/>
  <circle cx="450" cy="230" r="1.5" fill="#fef08a"/>
</svg>
