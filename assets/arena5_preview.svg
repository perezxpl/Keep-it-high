<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060a12"/>
      <stop offset="50%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>

    <!-- Laser Warning Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Hazard Pattern -->
    <pattern id="hazardPattern" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#eab308"/>
      <rect x="10" width="10" height="20" fill="#0f172a"/>
    </pattern>

    <!-- Steel Container Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Red Explosive Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Concrete Gradient -->
    <linearGradient id="concGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Line Detonation Glow -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="340" fill="url(#bgGrad)"/>

  <!-- Shaft Structural Grid -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.6">
    <line x1="160" y1="0" x2="160" y2="340"/>
    <line x1="208" y1="0" x2="208" y2="340"/>
    <line x1="256" y1="0" x2="256" y2="340"/>
    <line x1="304" y1="0" x2="304" y2="340"/>
    <line x1="352" y1="0" x2="352" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="448" y1="0" x2="448" y2="340"/>
    <line x1="110" y1="80" x2="490" y2="80"/>
    <line x1="110" y1="160" x2="490" y2="160"/>
    <line x1="110" y1="240" x2="490" y2="240"/>
  </g>

  <!-- Left & Right Factory Shaft Walls -->
  <rect x="0" y="0" width="110" height="340" fill="#0f172a"/>
  <rect x="490" y="0" width="110" height="340" fill="#0f172a"/>
  <rect x="110" y="0" width="14" height="340" fill="url(#hazardPattern)"/>
  <rect x="476" y="0" width="14" height="340" fill="url(#hazardPattern)"/>

  <!-- Warning Laser Beam -->
  <rect x="256" y="0" width="96" height="190" fill="url(#laserGrad)"/>
  <line x1="256" y1="0" x2="256" y2="190" stroke="#ef4444" stroke-width="2" opacity="0.85"/>
  <line x1="352" y1="0" x2="352" y2="190" stroke="#ef4444" stroke-width="2" opacity="0.85"/>

  <!-- Falling Block (Descending) -->
  <g transform="translate(256, 40)">
    <!-- 2x1 block -->
    <rect x="0" y="0" width="48" height="48" rx="4" fill="url(#redGrad)" stroke="#ef4444" stroke-width="2"/>
    <rect x="48" y="0" width="48" height="48" rx="4" fill="url(#redGrad)" stroke="#ef4444" stroke-width="2"/>
    <polygon points="24,14 36,36 12,36" fill="#facc15"/>
    <polygon points="72,14 84,36 60,36" fill="#facc15"/>
  </g>

  <!-- Target Footprint on Tower -->
  <rect x="256" y="190" width="96" height="48" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Stacked Tower Containers (Settled Blocks) -->
  <!-- Level 3 -->
  <rect x="160" y="190" width="48" height="48" rx="3" fill="url(#steelGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="208" y="190" width="48" height="48" rx="3" fill="url(#steelGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="352" y="190" width="48" height="48" rx="3" fill="url(#concGrad)" stroke="#64748b" stroke-width="2"/>

  <!-- Level 2 -->
  <rect x="160" y="238" width="48" height="48" rx="3" fill="url(#steelGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="208" y="238" width="48" height="48" rx="3" fill="url(#concGrad)" stroke="#64748b" stroke-width="2"/>
  <rect x="256" y="238" width="48" height="48" rx="3" fill="url(#steelGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="304" y="238" width="48" height="48" rx="3" fill="url(#steelGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="352" y="238" width="48" height="48" rx="3" fill="url(#redGrad)" stroke="#ef4444" stroke-width="2"/>
  <rect x="400" y="238" width="48" height="48" rx="3" fill="url(#steelGrad)" stroke="#475569" stroke-width="2"/>

  <!-- Level 1 (Full row detonating!) -->
  <rect x="124" y="286" width="352" height="48" fill="url(#glowGrad)"/>
  <rect x="124" y="286" width="48" height="48" rx="3" fill="#f59e0b" opacity="0.8"/>
  <rect x="172" y="286" width="48" height="48" rx="3" fill="#f59e0b" opacity="0.8"/>
  <rect x="220" y="286" width="48" height="48" rx="3" fill="#f59e0b" opacity="0.8"/>
  <rect x="268" y="286" width="48" height="48" rx="3" fill="#f59e0b" opacity="0.8"/>
  <rect x="316" y="286" width="48" height="48" rx="3" fill="#f59e0b" opacity="0.8"/>
  <rect x="364" y="286" width="48" height="48" rx="3" fill="#f59e0b" opacity="0.8"/>
  <rect x="412" y="286" width="48" height="48" rx="3" fill="#f59e0b" opacity="0.8"/>
  <line x1="124" y1="310" x2="476" y2="310" stroke="#fef08a" stroke-width="4"/>

  <!-- Detonation Sparks -->
  <circle cx="220" cy="305" r="3" fill="#fef08a"/>
  <circle cx="340" cy="295" r="4" fill="#fef08a"/>
  <circle cx="280" cy="318" r="2.5" fill="#f97316"/>
  <circle cx="410" cy="300" r="3.5" fill="#f59e0b"/>

  <!-- Tactical HUD Overlay -->
  <rect x="16" y="16" width="180" height="24" rx="4" fill="#0b1324" opacity="0.85" stroke="#0284c7" stroke-width="1.2"/>
  <text x="26" y="32" font-family="monospace" font-size="10" font-weight="900" fill="#38bdf8" letter-spacing="1">SEKTOR 05 // SZYB</text>

  <rect x="390" y="16" width="194" height="24" rx="4" fill="#0b1324" opacity="0.85" stroke="#ef4444" stroke-width="1.2"/>
  <text x="400" y="32" font-family="monospace" font-size="9" font-weight="900" fill="#f87171" letter-spacing="0.5">UWAGA: ZRZUT PIONOWY</text>
</svg>
